# Fotografa ogni giorno quanti download ha avuto l'installer, in tutto, e scrive una
# riga in download-history.csv: data, totale, nuovi del giorno.
#
# Serve perche' GitHub espone solo il contatore cumulativo del singolo asset di una
# singola release (`download_count`), lo sovrascrive e non ne tiene storia: il dato di
# ieri, se non lo si salva qui, e' perso per sempre. Sommare gli asset omonimi di tutte
# le release da il totale del prodotto, che nessuna pagina di GitHub mostra: alla
# pubblicazione di una versione nuova il suo contatore riparte da zero mentre quello
# della precedente resta fermo al valore raggiunto.
#
# Si contano solo gli asset AMetric_toolbox_setup.exe: .sha256 e .sig sono verifiche
# dell'installer, non download del programma.
#
# Il totale non scende mai (12/11/2026): download-releases.json tiene l'ultimo
# conteggio visto per ogni release, e una release cancellata resta li' col suo valore.
# Prima il totale era la somma delle sole release presenti, e quando fra il 17 e il
# 18/10/2026 sono state cancellate le release 1.0-1.2.1 e' sceso da 229 a 7: quei 229
# stanno in "eliminati_prima" e lo storico del CSV e' stato corretto dal 18/10.
name: Snapshot download count

on:
  schedule:
    - cron: "0 6 * * *" # ogni giorno alle 06:00 UTC
  workflow_dispatch: # avvio manuale dalla tab Actions

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Legge i contatori e scrive la riga di oggi
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          today=$(date -u +%F)

          # select(.draft | not): una release ancora in bozza ha i contatori a zero e
          # non c'entra col totale di quanto e' stato scaricato davvero.
          correnti=$(gh api "repos/${{ github.repository }}/releases" --paginate \
            --jq '.[] | select(.draft | not)
                  | {(.tag_name): ([.assets[] | select(.name == "AMetric_toolbox_setup.exe")
                                    | .download_count] | add // 0)}' | jq -s 'add // {}')

          # Per ogni release il valore piu' alto mai visto; le release sparite restano.
          [ -f download-releases.json ] || echo '{"eliminati_prima":0,"rilasci":{}}' > download-releases.json
          jq --argjson c "$correnti" '
            .rilasci as $r
            | .rilasci = ($r + ($c | with_entries(.value = ([.value, ($r[.key] // 0)] | max))))
          ' download-releases.json > .download-releases.tmp
          mv .download-releases.tmp download-releases.json
          totale=$(jq '(.eliminati_prima // 0) + ([.rilasci[]] | add // 0)' download-releases.json)

          [ -f download-history.csv ] || echo "data,totale,nuovi" > download-history.csv

          # Una sola riga per giorno: un avvio manuale ripetuto riscrive quella di oggi
          # invece di aggiungerne una seconda.
          grep -v "^$today," download-history.csv > .download-history.tmp || true
          mv .download-history.tmp download-history.csv

          # "nuovi" e' la differenza dall'ultima riga rimasta, cioe' dal giorno prima.
          # Resta vuoto se c'e' solo l'intestazione, perche' li' il pregresso non si sa.
          # Se una release venisse eliminata il suo contatore sparirebbe dal totale e
          # "nuovi" sarebbe negativo per un giorno: cambia la fotografia, non i download.
          precedente=$(tail -n 1 download-history.csv | cut -d, -f2)
          case "$precedente" in
            '' | *[!0-9]*) nuovi="" ;;
            *) nuovi=$((totale - precedente)) ;;
          esac

          echo "$today,$totale,$nuovi" >> download-history.csv

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add download-history.csv download-releases.json
          git diff --quiet --cached || git commit -m "Download count $(date -u +%F)"
          git push
